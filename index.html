<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>物件スカウト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252540;--border:#2e2e50;
  --accent:#6c63ff;--accent2:#ff6584;--text:#f0f0ff;--muted:#8888aa;
  --green:#22c55e;--amber:#f59e0b;--radius:14px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP','Sarabun',sans-serif;font-size:16px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto}
header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:17px;font-weight:700;color:var(--text)}.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:8px}
.count-badge{font-size:12px;color:var(--muted)}
.lang-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;-webkit-appearance:none}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:10px 4px;text-align:center;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;user-select:none;-webkit-user-select:none}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-icon{font-size:16px;margin-bottom:2px}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;opacity:1;transition:opacity .2s}
.page.hidden{opacity:0;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-btn{padding:14px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);text-align:center;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.type-btn .icon{font-size:26px;margin-bottom:5px}
.type-btn .label{font-size:13px;font-weight:500}
.type-btn.active{border-color:var(--accent);background:rgba(108,99,255,.15);color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;padding:11px 13px;outline:none;font-family:inherit;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted);opacity:.6}
textarea.inp{resize:none;line-height:1.5}
.photo-wrap{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;position:relative;overflow:hidden;cursor:pointer}
.photo-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-hint{color:var(--muted);font-size:13px;pointer-events:none}
.photo-hint .ph-icon{font-size:32px;margin-bottom:6px}
.photo-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photo-thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.loc-btn{width:100%;padding:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.loc-btn.got{border-color:var(--green);color:var(--green)}
.or-divider{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--muted);font-size:12px}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.addr-row{display:flex;gap:8px}
.addr-inp{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;padding:11px 13px;outline:none;font-family:inherit;-webkit-appearance:none}
.addr-inp:focus{border-color:var(--accent)}
.addr-inp::placeholder{color:var(--muted);opacity:.6}
.addr-gen-btn{padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.map-result{display:none;margin-top:8px}
.map-result a{font-size:12px;color:var(--accent);text-decoration:none}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st-btn{padding:10px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);text-align:center;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;user-select:none;-webkit-user-select:none}
.st-btn.act0{border-color:#6c63ff;background:rgba(108,99,255,.15);color:#6c63ff}
.st-btn.act1{border-color:#f59e0b;background:rgba(245,158,11,.15);color:#f59e0b}
.st-btn.act2{border-color:#22c55e;background:rgba(34,197,94,.15);color:#22c55e}
.st-btn.act3{border-color:#ff6584;background:rgba(255,101,132,.15);color:#ff6584}
.st-btn.act4{border-color:#8888aa;background:rgba(136,136,170,.15);color:#8888aa}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:15px;border-radius:var(--radius);border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;-webkit-appearance:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{background:#5a52e0}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-danger{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}
.btn-share{background:#25D366;color:#fff}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2}
.empty-state .e-icon{font-size:40px;margin-bottom:8px}
.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;cursor:pointer}
.prop-card:active{border-color:var(--accent)}
.prop-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.prop-card-name{font-size:15px;font-weight:600;color:var(--text);flex:1}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.b0{background:rgba(108,99,255,.15);color:#6c63ff}
.b1{background:rgba(245,158,11,.15);color:#f59e0b}
.b2{background:rgba(34,197,94,.15);color:#22c55e}
.b3{background:rgba(255,101,132,.15);color:#ff6584}
.b4{background:rgba(136,136,170,.15);color:#8888aa}
.prop-meta{font-size:12px;color:var(--muted);line-height:1.9}
.prop-meta a{color:var(--accent);text-decoration:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:none;align-items:flex-end;justify-content:center;-webkit-overflow-scrolling:touch}
.overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 40px}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-title{font-size:17px;font-weight:700;color:var(--text)}
.sheet-close{font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.modal-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px}
.m-tab{padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;background:var(--surface2)}
.m-tab.active{background:var(--accent);color:#fff}
.detail-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:12px}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--muted);white-space:nowrap}
.detail-val{color:var(--text);text-align:right;word-break:break-all}
.detail-val a{color:var(--accent);text-decoration:none}
.section-lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-bottom:8px;margin-top:14px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-val{font-size:12px;color:var(--muted);margin-right:10px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:10px 20px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:600;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="el-logo">物件<span>スカウト</span></div>
    <div class="header-right">
      <span class="count-badge" id="el-count">0件</span>
      <button class="lang-btn" id="el-langbtn" onclick="toggleLang()">🇹🇭 TH</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" id="tab0" onclick="goTab(0)"><div class="tab-icon">📍</div><span id="tl0">現地入力</span></div>
    <div class="tab" id="tab1" onclick="goTab(1)"><div class="tab-icon">📋</div><span id="tl1">物件詳細</span></div>
    <div class="tab" id="tab2" onclick="goTab(2)"><div class="tab-icon">🏠</div><span id="tl2">保存リスト</span></div>
  </div>
  <div class="pages">

    <!-- PAGE 1 現地入力 -->
    <div class="page" id="page0">
      <div class="card">
        <div class="card-title" id="lbl-typeTitle">物件の種類</div>
        <div class="type-grid">
          <div class="type-btn active" id="btn-tenant" onclick="setType('テナント')">
            <div class="icon">🏪</div><div class="label" id="lbl-tenant">テナント</div>
          </div>
          <div class="type-btn" id="btn-residence" onclick="setType('住居')">
            <div class="icon">🏠</div><div class="label" id="lbl-residence">住居</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-photoTitle">写真</div>
        <div class="photo-wrap">
          <input type="file" accept="image/*" multiple onchange="addPhotos(this,'thumbs0')">
          <div class="photo-hint"><div class="ph-icon">📷</div><span id="lbl-photoHint">タップして撮影 または ライブラリから選択</span></div>
        </div>
        <div class="photo-thumbs" id="thumbs0"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-phoneTitle">電話番号</div>
        <input class="inp" type="tel" id="f-phone" placeholder="081-234-5678">
      </div>
      <div class="card">
        <div class="card-title" id="lbl-locTitle">場所</div>
        <button class="loc-btn" id="loc-btn" onclick="getGPS()">
          <span id="loc-icon">📍</span> <span id="loc-txt">現在地を自動取得</span>
        </button>
        <div class="or-divider"><span id="lbl-or">または住所を手入力</span></div>
        <div class="addr-row">
          <input class="addr-inp" id="f-addr" placeholder="Sukhumvit Soi 11, Bangkok">
          <button class="addr-gen-btn" id="lbl-gen" onclick="genMapFromAddr()">🗺 生成</button>
        </div>
        <div class="map-result" id="map-result">
          <a id="map-link-a" href="#" target="_blank">🗺 Googleマップで確認 →</a>
        </div>
      </div>
      <button class="btn btn-primary" id="lbl-btnNext" onclick="goToDetail()">保存して詳細へ →</button>
      <button class="btn btn-secondary" id="lbl-btnFieldOnly" onclick="saveEntry()">現地情報だけ保存</button>
    </div>

    <!-- PAGE 2 物件詳細 -->
    <div class="page hidden" id="page1">
      <div class="card">
        <div class="card-title" id="lbl-propNameTitle">物件名 / 識別メモ</div>
        <input class="inp" type="text" id="f-propname" placeholder="例：Soi 11 角地テナント">
      </div>
      <div class="card">
        <div class="card-title" id="lbl-statusTitle">ステータス</div>
        <div class="status-grid" id="status-grid-main"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-rentTitle">家賃 / 費用</div>
        <div class="two-col">
          <div class="field"><label id="lbl-rent">月額家賃（฿）</label><input class="inp" type="number" id="f-rent" placeholder="25000"></div>
          <div class="field"><label id="lbl-deposit">敷金 / 保証金</label><input class="inp" type="text" id="f-deposit" placeholder="2ヶ月"></div>
        </div>
        <div class="field" style="margin-bottom:0"><label id="lbl-size">広さ（㎡）</label><input class="inp" type="number" id="f-size" placeholder="45"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-condTitle">賃貸条件・メモ</div>
        <div class="field"><label id="lbl-cond">契約条件</label><input class="inp" type="text" id="f-cond" placeholder="最低1年、ペット不可"></div>
        <div class="field" style="margin-bottom:0"><label id="lbl-notes">その他メモ</label><textarea class="inp" id="f-notes" rows="4" placeholder="駐車場あり、改装交渉可"></textarea></div>
      </div>
      <button class="btn btn-primary" id="lbl-btnSave" onclick="saveEntry()">💾 保存する</button>
      <button class="btn btn-secondary" id="lbl-btnBack" onclick="goTab(0)">← 現地入力に戻る</button>
    </div>

    <!-- PAGE 3 保存リスト -->
    <div class="page hidden" id="page2">
      <div id="list-wrap"></div>
    </div>

  </div>
</div>

<!-- MODAL (物件詳細) -->
<div class="overlay" id="modal" onclick="modalBgClick(event)">
  <div class="sheet">
    <div class="sheet-hdr">
      <div class="sheet-title" id="modal-title"></div>
      <div class="sheet-close" onclick="closeModal()">✕</div>
    </div>
    <div class="modal-tabs">
      <div class="m-tab active" id="mtab0" onclick="goModalTab(0)">📋 <span id="lbl-mDetail">詳細</span></div>
      <div class="m-tab" id="mtab1" onclick="goModalTab(1)">✏️ <span id="lbl-mEdit">編集</span></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="modal-view">
      <div class="section-lbl" id="lbl-statusChange">ステータス変更</div>
      <div class="status-grid" id="status-grid-modal"></div>
      <div id="modal-rows" style="margin-top:12px"></div>
      <div id="modal-photo-area" style="margin-top:10px"></div>
      <div class="section-lbl" style="margin-top:16px" id="lbl-appendNote">メモを追記</div>
      <textarea class="inp" id="append-inp" rows="3" placeholder="追記メモを入力..."></textarea>
      <button class="btn btn-secondary" id="lbl-btnAppend" onclick="doAppendNote()" style="margin-top:8px">📝 追記する</button>
      <div style="margin-top:10px;position:relative">
        <label style="display:block;width:100%;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit" id="lbl-btnAddPhoto">
          📷 写真を追加
          <input type="file" accept="image/*" multiple onchange="doAppendPhoto(this)" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
        </label>
      </div>
      <button class="btn btn-share" id="lbl-btnShareOpen" onclick="openShare()" style="margin-top:8px">📤 顧客に共有</button>
      <button class="btn btn-danger" id="lbl-btnDelete" onclick="doDelete()" style="margin-top:8px">🗑 この物件を削除</button>
    </div>

    <!-- EDIT VIEW -->
    <div id="modal-edit" style="display:none">
      <div class="field"><label id="lbl-eName">物件名</label><input class="inp" id="e-name"></div>
      <div class="field"><label id="lbl-ePhone">電話番号</label><input class="inp" type="tel" id="e-phone"></div>
      <div class="field"><label id="lbl-eMap">住所 / マップURL</label><input class="inp" id="e-map"></div>
      <div class="two-col" style="margin-bottom:12px">
        <div class="field"><label id="lbl-eRent">月額家賃（฿）</label><input class="inp" type="number" id="e-rent"></div>
        <div class="field"><label id="lbl-eDeposit">敷金 / 保証金</label><input class="inp" id="e-deposit"></div>
      </div>
      <div class="field"><label id="lbl-eSize">広さ（㎡）</label><input class="inp" type="number" id="e-size"></div>
      <div class="field"><label id="lbl-eCond">契約条件</label><input class="inp" id="e-cond"></div>
      <div class="field"><label id="lbl-eNotes">メモ</label><textarea class="inp" id="e-notes" rows="4"></textarea></div>
      <button class="btn btn-primary" id="lbl-btnSaveEdit" onclick="doSaveEdit()">💾 上書き保存</button>
    </div>
  </div>
</div>

<!-- SHARE SHEET -->
<div class="overlay" id="share-sheet" style="z-index:400" onclick="shareBgClick(event)">
  <div class="sheet">
    <div class="sheet-hdr">
      <div class="sheet-title" id="share-title">共有設定</div>
      <div class="sheet-close" onclick="closeShare()">✕</div>
    </div>
    <div class="section-lbl" id="lbl-shareFixed">✅ 必ず含まれる項目</div>
    <div id="share-fixed-preview" style="background:var(--surface2);border-radius:var(--radius-sm);padding:12px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.8;white-space:pre-wrap"></div>
    <div class="section-lbl" id="lbl-shareOpt">⚙️ 含めるか選べる項目</div>
    <div id="share-toggles"></div>
    <button class="btn btn-share" id="lbl-btnShare" onclick="doShare()" style="margin-top:16px">📋 コピーしてLINEに貼る</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:700;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lightbox-img" style="max-width:96vw;max-height:96vh;object-fit:contain;border-radius:8px">
</div>

<div id="toast"></div>

<script>
const CLOUDINARY_CLOUD = 'dnsp5zgoy';
const CLOUDINARY_PRESET = 'property-scout';
const STORAGE_KEY = 'prop_scout_v3';
const SB_URL = 'https://byikapxfaqfxglphoapg.supabase.co';
const SB_KEY = 'sb_publishable_MAHYtSIOOIwIkoAikBT8fQ_Iv-xxrPg';
const SB_HEADERS = { 'Content-Type': 'application/json', 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY };

async function sbFetch(path, opts={}) {
  const res = await fetch(SB_URL + path, { ...opts, headers: { ...SB_HEADERS, ...(opts.headers||{}) } });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  return res.status === 204 ? null : res.json();
}

async function syncToCloud(entry) {
  const row = {
    type: entry.type, status: entry.status, prop_name: entry.propName,
    phone: entry.phone, map_url: entry.mapUrl, address: entry.address||'',
    lat: entry.lat||'', lng: entry.lng||'', rent: entry.rent, deposit: entry.deposit,
    size: entry.size, cond: entry.cond, notes: entry.notes,
    photos: entry.photos||[], appended_notes: entry.appendedNotes||[], ts: entry.ts,
    local_id: String(entry.id)
  };
  if (entry.cloud_id) {
    await sbFetch('/rest/v1/properties?id=eq.'+entry.cloud_id, { method:'PATCH', body: JSON.stringify(row) });
  } else {
    const result = await sbFetch('/rest/v1/properties?select=id', { method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify(row) });
    return result && result[0] ? result[0].id : null;
  }
  return entry.cloud_id;
}

async function loadFromCloud() {
  const rows = await sbFetch('/rest/v1/properties?order=created_at.desc&select=*');
  if (!rows || !rows.length) return;
  const list = getList();
  rows.forEach(row => {
    const existing = list.find(x => x.cloud_id === row.id || String(x.id) === String(row.local_id));
    const entry = {
      id: existing ? existing.id : Date.now() + Math.random(),
      cloud_id: row.id,
      ts: row.ts || row.created_at,
      type: row.type, status: row.status||0, propName: row.prop_name,
      phone: row.phone, mapUrl: row.map_url, address: row.address,

      photos: row.photos||[], appendedNotes: row.appended_notes||[]
    };
    if (existing) { Object.assign(existing, entry); }
    else { list.push(entry); }
  });
  saveList(list);
}

async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CLOUDINARY_PRESET);
  const res = await fetch('https://api.cloudinary.com/v1_1/'+CLOUDINARY_CLOUD+'/image/upload',{method:'POST',body:fd});
  const data = await res.json();
  return data.secure_url;
}

function addPhotos(input, thumbId) {
  const files = Array.from(input.files).slice(0,10);
  if (!files.length) return;
  toast(t().processing,'');
  const thumbs = document.getElementById(thumbId);
  let done=0;
  files.forEach(async file => {
    try {
      const url = await uploadToCloudinary(file);
      state.photos.push(url);
      const img = document.createElement('img');
      img.src = url;
      thumbs.appendChild(img); thumbs.style.display='flex';
      done++;
      if (done===files.length) toast(files.length+t().photoAdded,'ok');
    } catch(e) { toast(t().uploadFail,'err'); }
  });
}

function getGPS() {
  const icon=document.getElementById('loc-icon'), txt=document.getElementById('loc-txt');
  txt.textContent=t().locGetting; icon.textContent='⏳';
  if (!navigator.geolocation){toast(t().locFail,'err');return;}
  navigator.geolocation.getCurrentPosition(pos => {
    state.lat=pos.coords.latitude.toFixed(6);
    state.lng=pos.coords.longitude.toFixed(6);
    state.mapUrl='https://www.google.com/maps?q='+state.lat+','+state.lng;
    icon.textContent='✅'; txt.textContent=t().locDone+' ('+state.lat+', '+state.lng+')';
    document.getElementById('loc-btn').classList.add('got');
    document.getElementById('map-result').style.display='block';
    document.getElementById('map-link-a').href=state.mapUrl;
    toast(t().locGot,'ok');
  }, ()=>{ icon.textContent='❌'; txt.textContent=t().locFail; toast(t().locFail,'err'); },{enableHighAccuracy:true,timeout:10000});
}

function genMapFromAddr() {
  const addr=document.getElementById('f-addr').value.trim();
  if (!addr){toast(t().noAddr,'err');return;}
  state.address=addr;
  state.mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
  state.lat=null; state.lng=null;
  document.getElementById('map-result').style.display='block';
  document.getElementById('map-link-a').href=state.mapUrl;
  toast(t().mapGenOk,'ok');
}

function saveEntry() {
  state.phone=document.getElementById('f-phone').value;
  const pn=document.getElementById('f-propname').value;
  const r=document.getElementById('f-rent').value;
  const d=document.getElementById('f-deposit').value;
  const s=document.getElementById('f-size').value;
  const c=document.getElementById('f-cond').value;
  const n=document.getElementById('f-notes').value;
  if(pn) state.propName=pn;
  if(r) state.rent=r;
  if(d) state.deposit=d;
  if(s) state.size=s;
  if(c) state.cond=c;
  if(n) state.notes=n;
  const list=getList();
  const entry={
    id:Date.now(),
    ts:state.ts||new Date().toLocaleString('ja-JP',{timeZone:'Asia/Bangkok'}),
    type:state.type, status:state.status,
    propName:state.propName||t().propDefault+' '+(list.length+1),
    phone:state.phone, mapUrl:state.mapUrl, address:state.address,
    lat:state.lat, lng:state.lng,
    rent:state.rent, deposit:state.deposit, size:state.size,
    cond:state.cond, notes:state.notes,
    photos:state.photos, appendedNotes:[]
  };
  list.push(entry); saveList(list); updateCount();
  toast(t().saved,'ok');
  resetForm();
  setTimeout(()=>goTab(2),800);
  syncToCloud(entry).then(cloud_id => {
    if (cloud_id) {
      const l = getList();
      const p = l.find(x => x.id === entry.id);
      if (p) { p.cloud_id = cloud_id; saveList(l); }
    }
  }).catch(()=>{});
}

function renderList() {

  }
  wrap.innerHTML=list.slice().reverse().map(p=>{
    const si=typeof p.status==='number'?p.status:0;
    return `<div class="prop-card" onclick="openModal(${p.id})">
      <div class="prop-card-top"><div class="prop-card-name">${p.propName}</div><span class="badge b${si}">${l.s[si]}</span></div>
      <div class="prop-meta">
        ${p.type}　${p.rent?'฿'+Number(p.rent).toLocaleString()+l.perMonth+'　':''}${p.size?p.size+l.sqm+'　':''}${p.phone?'📞'+p.phone+'　':''}${p.mapUrl?'<a href="'+p.mapUrl+'" target="_blank" onclick="event.stopPropagation()">🗺</a>':''}
        <br><span style="font-size:11px">${p.ts}</span>

  }).join('');

  document.getElementById('e-cond').value=p.cond||'';
  document.getElementById('e-notes').value=p.notes||'';
  document.getElementById('append-inp').value='';
  goModalTab(0);
  document.getElementById('modal').classList.add('open');
}

function goModalTab(idx) {
  document.getElementById('mtab0').classList.toggle('active',idx===0);
  document.getElementById('mtab1').classList.toggle('active',idx===1);
  document.getElementById('modal-view').style.display=idx===0?'block':'none';
  document.getElementById('modal-edit').style.display=idx===1?'block':'none';
}

function doAppendNote() {
  const txt=document.getElementById('append-inp').value.trim();
  if (!txt){toast(t().noNote,'err');return;}
  const list=getList(), p=list.find(x=>x.id===currentId);
  if (!p) return;
  if (!p.appendedNotes) p.appendedNotes=[];
  p.appendedNotes.push({text:txt,ts:new Date().toLocaleString('ja-JP',{timeZone:'Asia/Bangkok'})});
  saveList(list); toast(t().appended,'ok'); openModal(currentId);
  syncToCloud(p).catch(()=>{});
}

function doAppendPhoto(input) {
  const files=Array.from(input.files).slice(0,10);
  if (!files.length) return;
  const list=getList(), p=list.find(x=>x.id===currentId);
  if (!p) return;
  if (!p.photos) p.photos=[];
  toast(t().processing,'');
  let done=0;
  files.forEach(async file=>{
    try {
      const url=await uploadToCloudinary(file);
      p.photos.push(url); done++;
      if (done===files.length){saveList(list);toast(files.length+t().photoAdded,'ok');openModal(currentId);syncToCloud(p).catch(()=>{});}
    } catch(e){toast(t().uploadFail,'err');}
  });
}

function doSaveEdit() {
  const list=getList(), p=list.find(x=>x.id===currentId);
  if (!p) return;
  p.propName=document.getElementById('e-name').value||p.propName;
  p.phone=document.getElementById('e-phone').value;
  const rawMap=document.getElementById('e-map').value.trim();
  if (!rawMap){p.mapUrl='';p.address='';}
  else if (rawMap.startsWith('http')){p.mapUrl=rawMap;p.address='';}
  else {p.address=rawMap;p.mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(rawMap);}
  p.rent=document.getElementById('e-rent').value;
  p.deposit=document.getElementById('e-deposit').value;
  p.size=document.getElementById('e-size').value;
  p.cond=document.getElementById('e-cond').value;
  p.notes=document.getElementById('e-notes').value;
  saveList(list); renderList(); toast(t().saved,'ok');
  openModal(currentId); goModalTab(0);
  syncToCloud(p).catch(()=>{});
}

function doDelete() {
  if (!confirm(t().confirmDel)) return;
  const delEntry = getList().find(x=>x.id===currentId);
  saveList(getList().filter(x=>x.id!==currentId));
  updateCount(); renderList(); closeModal(); toast(t().deleted,'ok');
  if (delEntry && delEntry.cloud_id) deleteFromCloud(delEntry.cloud_id).catch(()=>{});
}

function closeModal(){document.getElementById('modal').classList.remove('open');currentId=null;}
function modalBgClick(e){if(e.target===document.getElementById('modal'))closeModal();}

// SHARE
function openShare() {
  const p=getList().find(x=>x.id===currentId);
  if (!p) return;
  const l=t();
  const typeLabel=p.type==='テナント'?'🏪 '+l.tenant:'🏠 '+l.residence;
  const fixed=[
    typeLabel, p.propName,
    p.rent?l.sRent+'฿'+Number(p.rent).toLocaleString()+l.perMonth:null,
    p.mapUrl?l.sMap+p.mapUrl:null,
    p.photos&&p.photos.length?l.sPhoto+p.photos.length+l.sPhotoSfx:null,
  ].filter(Boolean).join('\n');
  document.getElementById('share-fixed-preview').textContent=fixed;
  const opts=[
    {key:'phone',label:l.sOptPhone,val:p.phone},
    {key:'deposit',label:l.sOptDeposit,val:p.deposit},
    {key:'size',label:l.sOptSize,val:p.size?p.size+l.sqm:null},
    {key:'cond',label:l.sOptCond,val:p.cond},
    {key:'notes',label:l.sOptNotes,val:p.notes},
  ];
  const wrap=document.getElementById('share-toggles');
  wrap.innerHTML='';
  opts.forEach(opt=>{
    if (!opt.val) return;
    const checked=shareOpts[opt.key]!==false;
    const row=document.createElement('div');
    row.className='toggle-row';
    row.innerHTML=`<span style="font-size:14px;color:var(--text)">${opt.label}</span>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
        <span class="toggle-val">${opt.val}</span>
        <input type="checkbox" data-key="${opt.key}" ${checked?'checked':''} onchange="shareOpts[this.dataset.key]=this.checked" style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent)">
      </label>`;
    wrap.appendChild(row);
  });
  document.getElementById('share-sheet').classList.add('open');
}

function doShare() {
  const p=getList().find(x=>x.id===currentId);
  if (!p) return;
  const l=t();
  const typeLabel=p.type==='テナント'?'🏪 '+l.tenant:'🏠 '+l.residence;
  const lines=[
    l.shareHeader,
    typeLabel+' '+l.shareIntro,
    l.shareHeader,
    p.propName,
    p.rent?l.sRent+'฿'+Number(p.rent).toLocaleString()+l.perMonth:null,
    shareOpts.size!==false&&p.size?l.sSizeL+p.size+l.sqm:null,
    shareOpts.deposit!==false&&p.deposit?l.sDeposit+p.deposit:null,
    shareOpts.cond!==false&&p.cond?l.sCond+p.cond:null,
    shareOpts.phone!==false&&p.phone?l.sPhone+p.phone:null,
    p.mapUrl?l.sMap+p.mapUrl:null,
    p.photos&&p.photos.length?l.sPhoto+p.photos.length+l.sPhotoSfx:null,
    shareOpts.notes!==false&&p.notes?l.sNotes+p.notes:null,
    l.shareFooter,
  ].filter(Boolean).join('\n');
  const fallbackCopy = txt => {
    const ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    document.body.removeChild(ta);
    closeShare(); toast(l.copiedMsg,'ok');
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(lines)
      .then(()=>{ closeShare(); toast(l.copiedMsg,'ok'); })
      .catch(()=>fallbackCopy(lines));
  } else {
    fallbackCopy(lines);
  }
}

function closeShare(){document.getElementById('share-sheet').classList.remove('open');}
function shareBgClick(e){if(e.target===document.getElementById('share-sheet'))closeShare();}

function openLightbox(src){
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').style.display='flex';
}

function resetForm() {
  state=freshState();
  ['f-phone','f-rent','f-deposit','f-size','f-cond','f-notes','f-propname','f-addr'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value='';
  });
  document.getElementById('thumbs0').innerHTML='';
  document.getElementById('thumbs0').style.display='none';
  document.getElementById('loc-btn').classList.remove('got');
  document.getElementById('loc-icon').textContent='📍';
  document.getElementById('loc-txt').textContent=t().locBtn;
  document.getElementById('map-result').style.display='none';
  renderStatusGrid('status-grid-main',0,setStatusMain);
  setType('テナント');
}

function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(type?' '+type:'');
  clearTimeout(el._t);el._t=setTimeout(()=>{el.className='';},2800);
}

renderStatusGrid('status-grid-main',0,setStatusMain);
applyLang();

// 起動時にクラウドからデータを読み込む
loadFromCloud().then(()=>{ renderList(); updateCount(); }).catch(()=>{});

// 30秒ごとに自動同期
setInterval(()=>{
  loadFromCloud().then(()=>{ renderList(); updateCount(); }).catch(()=>{});
}, 30000);
