<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>物件スカウト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252540;--border:#2e2e50;
  --accent:#6c63ff;--accent2:#ff6584;--text:#f0f0ff;--muted:#8888aa;
  --green:#22c55e;--amber:#f59e0b;--radius:14px;--rsm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP','Sarabun',sans-serif;font-size:16px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto}
header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{font-size:17px;font-weight:700;color:var(--text)}.logo span{color:var(--accent)}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;-webkit-appearance:none;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:10px 4px;text-align:center;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;user-select:none;-webkit-user-select:none}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-icon{font-size:16px;margin-bottom:2px}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;opacity:1;transition:opacity .2s}
.page.hidden{opacity:0;pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-btn{padding:14px 8px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.type-btn .ico{font-size:26px;margin-bottom:5px}
.type-btn .lbl{font-size:13px;font-weight:500}
.type-btn.active{border-color:var(--accent);background:rgba(108,99,255,.15);color:var(--text)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);color:var(--text);font-size:15px;padding:11px 13px;outline:none;font-family:inherit;-webkit-appearance:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--muted);opacity:.6}
textarea.inp{resize:none;line-height:1.5}
.photo-wrap{border:1.5px dashed var(--border);border-radius:var(--rsm);padding:20px;text-align:center;position:relative;overflow:hidden;cursor:pointer}
.photo-wrap input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-hint{color:var(--muted);font-size:13px;pointer-events:none}
.photo-hint .phi{font-size:32px;margin-bottom:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.loc-btn{width:100%;padding:13px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-appearance:none}
.loc-btn.got{border-color:var(--green);color:var(--green)}
.or-div{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--muted);font-size:12px}
.or-div::before,.or-div::after{content:'';flex:1;height:1px;background:var(--border)}
.addr-row{display:flex;gap:8px}
.addr-inp{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--rsm);color:var(--text);font-size:14px;padding:11px 13px;outline:none;font-family:inherit;-webkit-appearance:none}
.addr-inp:focus{border-color:var(--accent)}
.addr-inp::placeholder{color:var(--muted);opacity:.6}
.addr-gen{padding:11px 14px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;-webkit-appearance:none}
.map-res{display:none;margin-top:8px}
.map-res a{font-size:12px;color:var(--accent);text-decoration:none}
.st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st-btn{padding:10px 4px;border-radius:var(--rsm);border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);text-align:center;font-size:12px;font-weight:500;cursor:pointer;user-select:none;-webkit-user-select:none}
.st-btn.a0{border-color:#6c63ff;background:rgba(108,99,255,.15);color:#6c63ff}
.st-btn.a1{border-color:#f59e0b;background:rgba(245,158,11,.15);color:#f59e0b}
.st-btn.a2{border-color:#22c55e;background:rgba(34,197,94,.15);color:#22c55e}
.st-btn.a3{border-color:#ff6584;background:rgba(255,101,132,.15);color:#ff6584}
.st-btn.a4{border-color:#8888aa;background:rgba(136,136,170,.15);color:#8888aa}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{width:100%;padding:15px;border-radius:var(--radius);border:none;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;-webkit-appearance:none;display:block;text-align:center}
.btn-p{background:var(--accent);color:#fff}
.btn-p:active{background:#5a52e0}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-d{background:transparent;color:var(--accent2);border:1px solid var(--accent2)}
.btn-share{background:#25D366;color:#fff}
.empty-st{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2}
.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;cursor:pointer}
.prop-card:active{border-color:var(--accent)}
.prop-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.prop-card-name{font-size:15px;font-weight:600;color:var(--text);flex:1}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap}
.b0{background:rgba(108,99,255,.15);color:#6c63ff}
.b1{background:rgba(245,158,11,.15);color:#f59e0b}
.b2{background:rgba(34,197,94,.15);color:#22c55e}
.b3{background:rgba(255,101,132,.15);color:#ff6584}
.b4{background:rgba(136,136,170,.15);color:#8888aa}
.prop-meta{font-size:12px;color:var(--muted);line-height:1.9}
.prop-meta a{color:var(--accent);text-decoration:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 20px 40px}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet-title{font-size:17px;font-weight:700;color:var(--text)}
.sheet-x{font-size:24px;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
.m-tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:var(--rsm);overflow:hidden;margin-bottom:16px}
.m-tab{padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;background:var(--surface2)}
.m-tab.active{background:var(--accent);color:#fff}
.d-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:12px}
.d-row:last-child{border-bottom:none}
.d-lbl{color:var(--muted);white-space:nowrap}
.d-val{color:var(--text);text-align:right;word-break:break-all}
.d-val a{color:var(--accent);text-decoration:none}
.sec-lbl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin:14px 0 8px}
.tog-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.tog-row:last-child{border-bottom:none}
.tog-val{font-size:12px;color:var(--muted);margin-right:8px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#loading{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:10px 20px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:600;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--green);color:var(--green)}
#toast.err{border-color:var(--accent2);color:var(--accent2)}
</style>
</head>
<body>

<!-- ローディング画面 -->
<div id="loading">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:14px">データを読み込み中...</div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="logo" id="el-logo">物件<span>スカウト</span></div>
    <div class="hdr-right">
      <span style="font-size:12px;color:var(--muted)" id="el-count">0件</span>
      <button class="hdr-btn" onclick="doSync()" title="同期">🔄</button>
      <button class="hdr-btn" onclick="copyStaffUrl()">👥</button>
      <button class="hdr-btn" id="el-langbtn" onclick="toggleLang()">🇹🇭 TH</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" id="tab0" onclick="goTab(0)"><div class="tab-icon">📍</div><span id="tl0">現地入力</span></div>
    <div class="tab" id="tab1" onclick="goTab(1)"><div class="tab-icon">📋</div><span id="tl1">物件詳細</span></div>
    <div class="tab" id="tab2" onclick="goTab(2)"><div class="tab-icon">🏠</div><span id="tl2">保存リスト</span></div>
  </div>
  <div class="pages">

    <!-- PAGE 1 -->
    <div class="page" id="page0">
      <div class="card">
        <div class="card-title" id="lbl-typeTitle">物件の種類</div>
        <div class="type-grid">
          <div class="type-btn active" id="btn-tenant" onclick="setType('テナント')"><div class="ico">🏪</div><div class="lbl" id="lbl-tenant">テナント</div></div>
          <div class="type-btn" id="btn-res" onclick="setType('住居')"><div class="ico">🏠</div><div class="lbl" id="lbl-res">住居</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-photoTitle">写真</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
          <div style="position:relative">
            <label style="display:block;padding:12px 8px;border-radius:var(--rsm);border:1.5px dashed var(--border);background:var(--surface2);color:var(--muted);text-align:center;cursor:pointer;font-size:13px">
              <div style="font-size:22px;margin-bottom:4px">🏠</div>
              <span id="lbl-exteriorPhoto">外観写真</span>
              <input type="file" accept="image/*" multiple onchange="addPhotos(this,'thumbs-ext','exterior')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
            </label>
          </div>
          <div style="position:relative">
            <label style="display:block;padding:12px 8px;border-radius:var(--rsm);border:1.5px dashed var(--border);background:var(--surface2);color:var(--muted);text-align:center;cursor:pointer;font-size:13px">
              <div style="font-size:22px;margin-bottom:4px">🛋</div>
              <span id="lbl-interiorPhoto">内装写真</span>
              <input type="file" accept="image/*" multiple onchange="addPhotos(this,'thumbs-int','interior')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
            </label>
          </div>
        </div>
        <div class="thumbs" id="thumbs-ext" style="margin-bottom:6px"></div>
        <div class="thumbs" id="thumbs-int"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-phoneTitle">電話番号</div>
        <input class="inp" type="tel" id="f-phone" placeholder="081-234-5678">
      </div>
      <div class="card">
        <div class="card-title" id="lbl-locTitle">場所</div>
        <button class="loc-btn" id="loc-btn" onclick="getGPS()"><span id="loc-icon">📍</span> <span id="loc-txt">現在地を自動取得</span></button>
        <div class="or-div"><span id="lbl-or">または住所を手入力</span></div>
        <div class="addr-row">
          <input class="addr-inp" id="f-addr" placeholder="Sukhumvit Soi 11, Bangkok">
          <button class="addr-gen" id="lbl-gen" onclick="genMap()">🗺 生成</button>
        </div>
        <div class="map-res" id="map-res"><a id="map-a" href="#" target="_blank">🗺 Googleマップで確認 →</a></div>
      </div>
      <button class="btn btn-p" id="lbl-btnNext" onclick="goToDetail()">保存して詳細へ →</button>
      <button class="btn btn-s" id="lbl-btnFieldOnly" onclick="saveEntry()">現地情報だけ保存</button>
    </div>

    <!-- PAGE 2 -->
    <div class="page hidden" id="page1">
      <div class="card">
        <div class="card-title" id="lbl-propNameTitle">物件名 / 識別メモ</div>
        <input class="inp" type="text" id="f-propname" placeholder="例：Soi 11 角地テナント">
      </div>
      <div class="card">
        <div class="card-title" id="lbl-statusTitle">ステータス</div>
        <div class="st-grid" id="st-grid-main"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-rentTitle">家賃 / 費用</div>
        <div class="two-col">
          <div class="field"><label id="lbl-rent">月額家賃（฿）</label><input class="inp" type="number" id="f-rent" placeholder="25000"></div>
          <div class="field"><label id="lbl-deposit">敷金 / 保証金</label><input class="inp" type="text" id="f-deposit" placeholder="2ヶ月"></div>
        </div>
        <div class="field" style="margin-bottom:0"><label id="lbl-size">広さ（㎡）</label><input class="inp" type="number" id="f-size" placeholder="45"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-condTitle">賃貸条件・メモ</div>
        <div class="field"><label id="lbl-cond">契約条件</label><input class="inp" type="text" id="f-cond" placeholder="最低1年、ペット不可"></div>
        <div class="field" style="margin-bottom:0"><label id="lbl-notes">その他メモ</label><textarea class="inp" id="f-notes" rows="4" placeholder="駐車場あり、改装交渉可"></textarea></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-driveTitle">📁 内装写真（Googleドライブ）</div>
        <div class="field" style="margin-bottom:0"><label id="lbl-driveUrl">ドライブ共有リンク</label><input class="inp" type="url" id="f-driveurl" placeholder="https://drive.google.com/..."></div>
      </div>
      <button class="btn btn-p" id="lbl-btnSave" onclick="saveEntry()">💾 保存する</button>
      <button class="btn btn-s" id="lbl-btnBack" onclick="goTab(0)">← 現地入力に戻る</button>
    </div>

    <!-- PAGE 3 -->
    <div class="page hidden" id="page2">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">
        <button onclick="openFolderMgr()" style="padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;-webkit-appearance:none;white-space:nowrap" id="lbl-folderMgr">📁 フォルダ管理</button>
        <button onclick="exportCSV()" style="padding:8px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:500;cursor:pointer;-webkit-appearance:none;white-space:nowrap">📥 CSV</button>
      </div>
      <div id="folder-bar" style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch"></div>
      <div id="list-wrap"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="modal" onclick="modalBg(event)">
  <div class="sheet">
    <div class="sheet-hdr">
      <div class="sheet-title" id="modal-title"></div>
      <div class="sheet-x" onclick="closeModal()">✕</div>
    </div>
    <div class="m-tabs">
      <div class="m-tab active" id="mtab0" onclick="goMTab(0)">📋 <span id="lbl-mDetail">詳細</span></div>
      <div class="m-tab" id="mtab1" onclick="goMTab(1)">✏️ <span id="lbl-mEdit">編集</span></div>
    </div>
    <div id="modal-view">
      <div class="sec-lbl" id="lbl-stChange">ステータス変更</div>
      <div class="st-grid" id="st-grid-modal"></div>
      <div id="modal-rows" style="margin-top:12px"></div>
      <div id="modal-photos" style="margin-top:10px"></div>
      <div class="sec-lbl" style="margin-top:16px" id="lbl-appendNote">メモを追記</div>
      <textarea class="inp" id="append-inp" rows="3" placeholder="追記メモを入力..."></textarea>
      <button class="btn btn-s" id="lbl-btnAppend" onclick="doAppendNote()" style="margin-top:8px">📝 追記する</button>
      <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="position:relative">
          <label style="display:block;width:100%;padding:12px 8px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit" id="lbl-btnAddExt">
            🏠 外観追加
            <input type="file" accept="image/*" multiple onchange="doAppendPhoto(this,'exterior')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
          </label>
        </div>
        <div style="position:relative">
          <label style="display:block;width:100%;padding:12px 8px;border-radius:var(--rsm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit" id="lbl-btnAddInt">
            🛋 内装追加
            <input type="file" accept="image/*" multiple onchange="doAppendPhoto(this,'interior')" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%">
          </label>
        </div>
      </div>
      <button class="btn btn-share" onclick="openShare()" style="margin-top:8px" id="lbl-btnShareOpen">📤 顧客に共有</button>
      <button class="btn btn-d" onclick="doDelete()" style="margin-top:8px" id="lbl-btnDelete">🗑 この物件を削除</button>
    </div>
    <div id="modal-edit" style="display:none">
      <div class="field"><label id="lbl-eName">物件名</label><input class="inp" id="e-name"></div>
      <div class="field"><label id="lbl-ePhone">電話番号</label><input class="inp" type="tel" id="e-phone"></div>
      <div class="field"><label id="lbl-eMap">住所 / マップURL</label><input class="inp" id="e-map"></div>
      <div class="two-col" style="margin-bottom:12px">
        <div class="field"><label id="lbl-eRent">月額家賃（฿）</label><input class="inp" type="number" id="e-rent"></div>
        <div class="field"><label id="lbl-eDeposit">敷金 / 保証金</label><input class="inp" id="e-deposit"></div>
      </div>
      <div class="field"><label id="lbl-eSize">広さ（㎡）</label><input class="inp" type="number" id="e-size"></div>
      <div class="field"><label id="lbl-eCond">契約条件</label><input class="inp" id="e-cond"></div>
      <div class="field"><label id="lbl-eNotes">メモ</label><textarea class="inp" id="e-notes" rows="4"></textarea></div>
      <div class="field"><label id="lbl-eDriveUrl">ドライブリンク</label><input class="inp" type="url" id="e-driveurl" placeholder="https://drive.google.com/..."></div>
      <div class="field"><label id="lbl-eFolder">フォルダ</label><select class="inp" id="e-folder"></select></div>
      <button class="btn btn-p" onclick="doSaveEdit()" id="lbl-btnSaveEdit">💾 上書き保存</button>
    </div>
  </div>
</div>

<!-- SHARE SHEET -->
<div class="overlay" id="share-sheet" style="z-index:400" onclick="shareBg(event)">
  <div class="sheet">

function exportCSV() {
  const st = ['未交渉','交渉中','契約済み','NG','保留'];
  const headers = ['保存日時','種類','物件名','電話','マップURL','家賃','敷金','広さ','条件','メモ','ステータス','写真枚数'];
  const esc = v => '"' + String(v||'').split('"').join('""') + '"';
  const rows = DB.map(p => [
    p.ts, p.type, p.propName, p.phone, p.mapUrl,
    p.rent, p.deposit, p.size, p.cond, p.notes,
    st[p.status]||'未交渉', (p.photos||[]).length
  ].map(esc).join(','));
  const csv = '\uFEFF' + [headers.map(esc).join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '物件スカウト_' + new Date().toLocaleDateString('ja-JP').split('/').join('-') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSVをダウンロードしました','ok');
}

// ===== Supabase =====
async function sbReq(path, opts={}) {
  const res = await fetch(SB_URL+path, {
    ...opts,
    headers: {...SB_H, ...(opts.headers||{})}
  });
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
}

// Supabaseから全データを取得してDBとキャッシュを更新
async function syncDown() {
  const rows = await sbReq('/rest/v1/properties?order=created_at.desc&select=*');
  DB = (rows||[]).map(rowToEntry);
  // 古いstring形式の写真を{url,tag}形式に変換
  DB.forEach(p=>{
    if (p.photos && p.photos.length) {
      p.photos = p.photos.map(ph=>
        typeof ph === 'string' ? {url:ph, tag:'exterior'} : ph
      );
    }
  });
  sortDB();
  localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
  return DB;
}

// sort_orderの大きい順（手動並び替え優先）、未設定は新しい順
function sortDB() {
  DB.sort((a,b)=>{
    const ao = a.sortOrder||0, bo = b.sortOrder||0;
    if (ao !== bo) return bo - ao;
    return 0;
  });
}

// Supabaseに新規保存
async function sbInsert(entry) {
  const result = await sbReq('/rest/v1/properties?select=id', {
    method:'POST',
    headers:{'Prefer':'return=representation'},
    body: JSON.stringify(entryToRow(entry))
  });
  return result && result[0] ? result[0].id : null;
}

// Supabaseを更新
async function sbUpdate(entry) {
  await sbReq('/rest/v1/properties?id=eq.'+entry.cloud_id, {
    method:'PATCH',
    body: JSON.stringify(entryToRow(entry))
  });
}

// Supabaseから削除
async function sbDelete(cloudId) {
  await sbReq('/rest/v1/properties?id=eq.'+cloudId, {method:'DELETE'});
}

function rowToEntry(row) {
  return {
    cloud_id: row.id,
    ts: row.ts || row.created_at,
    type: row.type || 'テナント',
    status: typeof row.status === 'number' ? row.status : 0,
    propName: row.prop_name || '',
    phone: row.phone || '',
    mapUrl: row.map_url || '',
    address: row.address || '',
    lat: row.lat || null,
    lng: row.lng || null,
    rent: row.rent || '',
    deposit: row.deposit || '',
    size: row.size || '',
    cond: row.cond || '',
    notes: row.notes || '',
    photos: row.photos || [],
    appendedNotes: row.appended_notes || [],
    folder: row.folder || '',
    sortOrder: typeof row.sort_order === 'number' ? row.sort_order : 0,
    driveUrl: row.drive_url || ''
  };
}

function entryToRow(entry) {
  return {
    type: entry.type,
    status: entry.status,
    prop_name: entry.propName,
    phone: entry.phone,
    map_url: entry.mapUrl,
    address: entry.address || '',
    lat: entry.lat || '',
    lng: entry.lng || '',
    rent: entry.rent,
    deposit: entry.deposit,
    size: entry.size,
    cond: entry.cond,
    notes: entry.notes,
    photos: entry.photos || [],
    appended_notes: entry.appendedNotes || [],
    ts: entry.ts,
    folder: entry.folder || '',
    sort_order: typeof entry.sortOrder === 'number' ? entry.sortOrder : 0,
    drive_url: entry.driveUrl || ''
  };
}

// ===== Photos =====
async function uploadPhoto(file) {
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CLOUD_PRESET);
  const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd});
  const data=await res.json();
  if (!data.secure_url) throw new Error('Upload failed');
  return data.secure_url;
}

function addPhotos(input,thumbId,tag) {
  const files=Array.from(input.files).slice(0,10);
  if (!files.length) return;
  const photoTag=tag||'exterior';
  toast(t().uploading,'');
  const thumbs=document.getElementById(thumbId);
  let done=0;
  files.forEach(async file=>{
    try {
      const url=await uploadPhoto(file);
      state.photos.push({url:url,tag:photoTag});
      const img=document.createElement('img');
      img.src=url;
      thumbs.appendChild(img);thumbs.style.display='flex';
      done++;
      if (done===files.length) toast(files.length+t().photoAdded,'ok');
    } catch(e) { toast(t().uploadFail,'err'); }
  });
}

// ===== GPS =====
function getGPS() {
  const icon=document.getElementById('loc-icon'),txt=document.getElementById('loc-txt');
  txt.textContent=t().locGetting;icon.textContent='⏳';
  if (!navigator.geolocation){toast(t().locFail,'err');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    state.lat=pos.coords.latitude.toFixed(6);
    state.lng=pos.coords.longitude.toFixed(6);
    state.mapUrl='https://www.google.com/maps?q='+state.lat+','+state.lng;
    icon.textContent='✅';txt.textContent=t().locDone+' ('+state.lat+', '+state.lng+')';
    document.getElementById('loc-btn').classList.add('got');
    document.getElementById('map-res').style.display='block';
    document.getElementById('map-a').href=state.mapUrl;
    toast(t().locGot,'ok');
  },()=>{icon.textContent='❌';txt.textContent=t().locFail;toast(t().locFail,'err');},{enableHighAccuracy:true,timeout:10000});
}

function genMap() {
  const addr=document.getElementById('f-addr').value.trim();
  if (!addr){toast(t().noAddr,'err');return;}
  state.address=addr;
  state.mapUrl='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
  state.lat=null;state.lng=null;
  document.getElementById('map-res').style.display='block';
  document.getElementById('map-a').href=state.mapUrl;
  toast(t().mapOk,'ok');
}

    wrap.onclick=null;
    return;
  }
  const html = list.map((p)=>{
    const si=typeof p.status==='number'?p.status:0;
    const meta = [
      p.type,
      p.rent ? '฿'+Number(p.rent).toLocaleString()+l.pm : '',
      p.size ? p.size+l.sqm : '',
      p.phone ? '📞'+p.phone : '',
    ].filter(Boolean).join('　');
    const mapLink = p.mapUrl ? '<a href="'+p.mapUrl+'" target="_blank" onclick="event.stopPropagation()">🗺</a>' : '';

      const thumbs = extPhotos.slice(0,2).map(ph=>
        '<img src="'+photoUrl(ph)+'" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">'
      ).join('');
      const intCount = p.photos.filter(ph=>photoTag(ph)==='interior').length;
      const more = extPhotos.length>2 ? '<div style="width:64px;height:64px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)">+'+(extPhotos.length-2)+'</div>' : '';
      const intBadge = intCount>0 ? '<div style="font-size:11px;color:var(--muted);margin-top:4px">🛋 内装 '+intCount+'枚</div>' : '';
      photoThumbs = '<div style="margin-top:8px"><div style="display:flex;gap:6px">'+thumbs+more+'</div>'+intBadge+'</div>';
    }

      +'<div class="drag-handle" data-handle="'+p.cloud_id+'" style="flex-shrink:0;padding:4px 2px;cursor:grab;color:var(--muted);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none">⋮⋮</div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="prop-card-top">'
      +'<div class="prop-card-name">'+p.propName+folderTag+'</div>'
      +'<span class="badge b'+si+'">'+l.s[si]+'</span>'
      +'</div>'
      +'<div class="prop-meta">'+meta+(mapLink?'　'+mapLink:'')
      +'<br><span style="font-size:11px">'+p.ts+'</span>'
      +'</div>'
      +photoThumbs
      +'</div></div>';
  }).join('');
  wrap.innerHTML = html;
  wrap.onclick = function(e) {
    if (e.target.closest('.drag-handle')) return;
    const card = e.target.closest('.prop-card');
    if (card && card.dataset.cid && !card.dataset.dragging) openModal(card.dataset.cid);

// 写真タブ切替レンダリング
function renderPhotoTabs(p, container, activeTab) {
  const photos = p ? (p.photos||[]) : [];
  if (!photos.length) { container.innerHTML=''; return; }
  const exterior = photos.filter(ph=>photoTag(ph)==='exterior');
  const interior = photos.filter(ph=>photoTag(ph)==='interior');
  const l = t();
  const mkThumb = (ph) => {
    const url = photoUrl(ph);
    const globalIdx = photos.indexOf(ph);
    const div = document.createElement('div');
    div.style.cssText = 'position:relative;display:inline-block';
    const img = document.createElement('img');
    img.src = url;
    img.style.cssText = 'width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:zoom-in;display:block';
    img.onclick = () => openLB(url);
    const btn = document.createElement('button');
    btn.textContent = '✕';
    btn.style.cssText = 'position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--accent2);color:#fff;font-size:11px;font-weight:700;cursor:pointer;line-height:20px;padding:0';
    btn.onclick = () => deletePhoto(globalIdx);
    div.appendChild(img);
    div.appendChild(btn);
    return div;
  };
  container.innerHTML = '';
  // タブバー
  const tabBar = document.createElement('div');
  tabBar.style.cssText = 'display:flex;border-bottom:1px solid var(--border);margin-bottom:10px';
  const mkTab = (label, tag) => {
    const btn = document.createElement('button');
    const isActive = activeTab === tag;
    btn.style.cssText = 'padding:8px 16px;border:none;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid '+(isActive?'var(--accent)':'transparent')+';background:transparent;color:'+(isActive?'var(--accent)':'var(--muted)')+';font-family:inherit';
    btn.textContent = label;
    btn.onclick = () => renderPhotoTabs(p, container, tag);
    return btn;
  };
  tabBar.appendChild(mkTab('🏠 '+(l.exteriorPhoto||'外観')+' ('+exterior.length+')', 'exterior'));
  tabBar.appendChild(mkTab('🛋 '+(l.interiorPhoto||'内装')+' ('+interior.length+')', 'interior'));
  container.appendChild(tabBar);
  // 写真グリッド
  const grid = document.createElement('div');
  grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:10px';
  const list = activeTab === 'exterior' ? exterior : interior;
  list.forEach(ph => grid.appendChild(mkThumb(ph)));
  container.appendChild(grid);
}

// 写真データから安全にURLを取得（旧string形式と新{url,tag}形式の両対応）
function photoUrl(p) { return typeof p === 'string' ? p : (p&&p.url ? p.url : ''); }
function photoTag(p) { return typeof p === 'string' ? 'exterior' : (p&&p.tag ? p.tag : 'exterior'); }

async function deletePhoto(idx) {
  const p = DB.find(x=>Number(x.cloud_id)===Number(curId));
  if (!p || !p.photos) return;
  if (!confirm(t().confirmDelPhoto)) return;
  p.photos.splice(idx, 1);
  try {
    await sbUpdate(p);
    localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
    toast(t().photoDeleted,'ok');
    openModal(curId);
    renderList();
  } catch(e) { toast(t().syncErr,'err'); }
}

async function doAppendNote() {
  const txt=document.getElementById('append-inp').value.trim();
  if (!txt){toast(t().noNote,'err');return;}
  const p=DB.find(x=>Number(x.cloud_id)===Number(curId));
  if (!p) return;
  if (!p.appendedNotes) p.appendedNotes=[];
  p.appendedNotes.push({text:txt,ts:new Date().toLocaleString('ja-JP',{timeZone:'Asia/Bangkok'})});
  try {
    await sbUpdate(p);
    localStorage.setItem(CACHE_KEY,JSON.stringify(DB));
    toast(t().appended,'ok');
    openModal(curId);
  } catch(e) { toast(t().syncErr,'err'); }
}

function doAppendPhoto(input,tag) {
  const photoTag=tag||'exterior';
  const files=Array.from(input.files).slice(0,10);
  if (!files.length) return;
  const p=DB.find(x=>Number(x.cloud_id)===Number(curId));
  if (!p) return;
  if (!p.photos) p.photos=[];
  toast(t().uploading,'');
  let done=0;
  files.forEach(async file=>{
    try {
      const url=await uploadPhoto(file);
      p.photos.push({url:url,tag:photoTag});done++;
      if (done===files.length){
        await sbUpdate(p);
        localStorage.setItem(CACHE_KEY,JSON.stringify(DB));
        toast(files.length+t().photoAdded,'ok');
        openModal(curId);
      }
    } catch(e) { toast(t().uploadFail,'err'); }
  });
}

          if(el) el.style.borderColor=this.checked?'var(--accent)':'var(--border)';
        };
        lbl.appendChild(img);lbl.appendChild(cb);
        row.appendChild(lbl);
      });
      pg.appendChild(row);
    };
    mkSection(extPhotos,'🏠 '+(l2.exteriorPhoto||'外観'));
    mkSection(intPhotos,'🛋 '+(l2.interiorPhoto||'内装'));
  }
  document.getElementById('share-sheet').classList.add('open');
}

function copyText(txt,cb) {
  if (navigator.clipboard&&window.isSecureContext) {
    navigator.clipboard.writeText(txt).then(cb).catch(()=>fallbackCopy(txt,cb));
  } else { fallbackCopy(txt,cb); }
}

function fallbackCopy(txt,cb) {
  const ta=document.createElement('textarea');
  ta.value=txt;ta.style.cssText='position:fixed;top:-9999px;left:-9999px';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  if(cb) cb();
}

// ===== FOLDER =====
const FOLDER_KEY = 'prop_folders_v1';
let folders = [];
let currentFolder = '__all__';

function getFolders() {
  try { folders = JSON.parse(localStorage.getItem(FOLDER_KEY)) || []; }
  catch(e) { folders = []; }
  return folders;
}
function saveFolders() { localStorage.setItem(FOLDER_KEY, JSON.stringify(folders)); }

function renderFolderBar() {
  const bar = document.getElementById('folder-bar');
  const l = t();
  const mkChip = (key,label) => {
    const active = currentFolder===key;
    return '<button onclick="selectFolder(\''+key.replace(/'/g,"")+'\')" style="padding:6px 14px;border-radius:20px;border:1.5px solid '+(active?'var(--accent)':'var(--border)')+';background:'+(active?'rgba(108,99,255,.15)':'var(--surface2)')+';color:'+(active?'var(--accent)':'var(--muted)')+';font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;-webkit-appearance:none">'+label+'</button>';
  };
  let html = mkChip('__all__', l.allFolders);
  html += mkChip('', l.noFolder);
  folders.forEach(f=>{ html += mkChip(f, '📁 '+f); });
  bar.innerHTML = html;
}

function selectFolder(key) {
  currentFolder = key;
  renderFolderBar();
  renderList();
}

function openFolderMgr() {
  renderFolderList();
  document.getElementById('folder-mgr').classList.add('open');
}
function closeFolderMgr() { document.getElementById('folder-mgr').classList.remove('open'); }
function folderBg(e) { if (e.target===document.getElementById('folder-mgr')) closeFolderMgr(); }

function renderFolderList() {
  const wrap = document.getElementById('folder-list');
  const l = t();
  if (!folders.length) {
    wrap.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:13px;padding:20px">'+l.noFolderYet+'</div>';
    return;
  }
  wrap.innerHTML = folders.map((f,i)=>{
    const count = DB.filter(p=>p.folder===f).length;
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">'
      +'<span style="font-size:14px;color:var(--text)">📁 '+f+' <span style="color:var(--muted);font-size:12px">('+count+')</span></span>'
      +'<span style="display:flex;gap:8px">'
      +'<span onclick="renameFolder('+i+')" style="cursor:pointer;color:var(--accent);font-size:13px">✏️</span>'
      +'<span onclick="deleteFolder('+i+')" style="cursor:pointer;color:var(--accent2);font-size:13px">🗑</span>'
      +'</span></div>';
  }).join('');
}

function addFolder() {
  const name = document.getElementById('new-folder-name').value.trim();
  if (!name) { toast(t().noFolderName,'err'); return; }
  if (folders.includes(name)) { toast(t().folderExists,'err'); return; }
  folders.push(name);
  saveFolders();
  document.getElementById('new-folder-name').value='';
  renderFolderList();
  renderFolderBar();
  toast(t().folderAdded,'ok');
}

function renameFolder(i) {
  const oldName = folders[i];
  const newName = prompt(t().renamePrompt, oldName);
  if (!newName || !newName.trim() || newName===oldName) return;
  const trimmed = newName.trim();
  if (folders.includes(trimmed)) { toast(t().folderExists,'err'); return; }
  folders[i] = trimmed;
  saveFolders();
  // 該当物件のフォルダ名も更新
  DB.filter(p=>p.folder===oldName).forEach(p=>{
    p.folder = trimmed;
    sbUpdate(p).catch(()=>{});
  });
  localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
  renderFolderList(); renderFolderBar(); renderList();
  toast(t().saved,'ok');
}

function deleteFolder(i) {
  const name = folders[i];
  if (!confirm(t().confirmDelFolder.replace('{}',name))) return;
  // 該当物件はフォルダなしに
  DB.filter(p=>p.folder===name).forEach(p=>{
    p.folder = '';
    sbUpdate(p).catch(()=>{});
  });
  localStorage.setItem(CACHE_KEY, JSON.stringify(DB));
  folders.splice(i,1);
  saveFolders();
  if (currentFolder===name) currentFolder='__all__';
  renderFolderList(); renderFolderBar(); renderList();
  toast(t().deleted,'ok');
}

// ===== 並び替え（ドラッグ・スムーズ版） =====
let dragState = null;

function setupDragSort(wrap) {
  wrap.querySelectorAll('.drag-handle').forEach(handle => {
    handle.addEventListener('touchstart', onDragStart, {passive:false});
    handle.addEventListener('mousedown', onDragStart);
  });
}

function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

function onDragStart(e) {
  e.preventDefault();
  const handle = e.currentTarget;
  const card = handle.closest('.prop-card');
  const wrap = document.getElementById('list-wrap');
  if (!card) return;

  const cards = Array.from(wrap.querySelectorAll('.prop-card'));
  const rect = card.getBoundingClientRect();

  // プレースホルダ（移動先を示す空白）
  const placeholder = document.createElement('div');
  placeholder.style.height = rect.height + 'px';
  placeholder.style.margin = '0 0 12px 0';
  placeholder.style.borderRadius = 'var(--radius)';
  placeholder.style.border = '2px dashed var(--accent)';
  placeholder.style.background = 'rgba(108,99,255,.06)';
  placeholder.className = 'drag-placeholder';

  // ドラッグ中カードを浮かせる（fixed配置で指に追従）
  card.dataset.dragging = '1';
  card.style.position = 'fixed';
  card.style.zIndex = '800';
  card.style.width = rect.width + 'px';
  card.style.left = rect.left + 'px';
  card.style.top = rect.top + 'px';
  card.style.pointerEvents = 'none';
  card.style.boxShadow = '0 8px 24px rgba(0,0,0,.4)';
  card.style.opacity = '0.95';
  card.style.transition = 'none';

  wrap.insertBefore(placeholder, card);

  dragState = {
    card, wrap, placeholder,
    startY: getY(e),
    cardTop: rect.top,
    cardHeight: rect.height,
    rafPending: false,
    lastY: getY(e)
  };

  document.addEventListener('touchmove', onDragMove, {passive:false});
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
  if (!dragState) return;
  e.preventDefault();
  dragState.lastY = getY(e);
  // requestAnimationFrameで1フレーム1回だけ処理（震え防止）
  if (!dragState.rafPending) {
    dragState.rafPending = true;
    requestAnimationFrame(processDragMove);
  }
}

function processDragMove() {
  if (!dragState) return;
  dragState.rafPending = false;
  const { card, wrap, placeholder, startY, cardTop, lastY } = dragState;

  // カードを指に追従
  const dy = lastY - startY;
  card.style.top = (cardTop + dy) + 'px';

  // 現在のドラッグカードの中心Y
  const dragMid = cardTop + dy + dragState.cardHeight/2;

  // プレースホルダの移動先を決定（他のカードと比較）
  const others = Array.from(wrap.querySelectorAll('.prop-card:not([data-dragging]), .drag-placeholder'));
  let inserted = false;
  for (const el of others) {
    if (el === placeholder) continue;
    const r = el.getBoundingClientRect();
    const mid = r.top + r.height/2;
    if (dragMid < mid) {
      if (placeholder.nextSibling !== el) wrap.insertBefore(placeholder, el);
      inserted = true;
      break;
    }
  }
  if (!inserted) {
    // 一番下へ
    if (wrap.lastElementChild !== placeholder) wrap.appendChild(placeholder);
  }
}

function onDragEnd() {
  if (!dragState) return;
  const { card, wrap, placeholder } = dragState;

  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('mouseup', onDragEnd);

  // カードのスタイルをリセット
  card.style.position = '';
  card.style.zIndex = '';
  card.style.width = '';
  card.style.left = '';
  card.style.top = '';
  card.style.pointerEvents = '';
  card.style.boxShadow = '';
  card.style.opacity = '';
  card.style.transition = '';

  // プレースホルダの位置にカードを移動
  wrap.insertBefore(card, placeholder);
  placeholder.remove();

  // 新しい並び順でsortOrderを再採番
  const orderedCids = Array.from(wrap.querySelectorAll('.prop-card')).map(c=>c.dataset.cid);
  const base = Date.now();
  const changed = [];
  orderedCids.forEach((cid, i)=>{
    const p = DB.find(x=>String(x.cloud_id)===String(cid));
    if (p) {
      const newOrder = base - i;
      if (p.sortOrder !== newOrder) { p.sortOrder = newOrder; changed.push(p); }
    }
  });
  sortDB();
  localStorage.setItem(CACHE_KEY, JSON.stringify(DB));

  const dragged = card;
  setTimeout(()=>{ if(dragged) delete dragged.dataset.dragging; }, 50);
  dragState = null;

  changed.forEach(p=>sbUpdate(p).catch(()=>{}));
  if (changed.length) toast(t().reordered,'ok');
  renderList();
}

  if (currentFolder==='__all__') return DB;

(async()=>{
  try {
    // まずキャッシュを表示
    const cache=localStorage.getItem(CACHE_KEY);
    if (cache) {
      DB=JSON.parse(cache);
      // キャッシュの古いstring形式も変換
      DB.forEach(p=>{
        if (p.photos && p.photos.length) {
          p.photos = p.photos.map(ph=>
            typeof ph === 'string' ? {url:ph, tag:'exterior'} : ph
          );
        }
      });
    }
    // Supabaseから最新を取得
    await syncDown();
    updateCount();
    renderList();
  } catch(e) {
    // オフライン時はキャッシュを使用
    const cache=localStorage.getItem(CACHE_KEY);
    if (cache) { DB=JSON.parse(cache); updateCount(); renderList(); }
  }
  // DBから既存フォルダを収集してローカルにマージ
  const dbFolders = [...new Set(DB.map(p=>p.folder).filter(f=>f))];
  dbFolders.forEach(f=>{ if(!folders.includes(f)) folders.push(f); });
  saveFolders();
  renderFolderBar();

  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  // 手動同期のみ（🔄ボタン）
})();
