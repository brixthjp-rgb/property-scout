<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>物件スカウト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#252540;--border:#2e2e50;
  --accent:#6c63ff;--accent2:#ff6584;--text:#f0f0ff;--muted:#8888aa;
  --green:#22c55e;--amber:#f59e0b;--radius:14px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;font-size:16px;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;max-width:430px;margin:0 auto}
header{padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-size:17px;font-weight:700;color:var(--text)}.logo span{color:var(--accent)}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface);border-bottom:1px solid var(--border)}
.tab{padding:10px 4px;text-align:center;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;user-select:none}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-icon{font-size:16px;margin-bottom:2px}
.pages{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow-y:auto;padding:16px;transition:transform .25s ease,opacity .25s ease}
.page.hidden{pointer-events:none;opacity:0;transform:translateX(30px)}
#page-field.hidden{transform:translateX(-30px)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type-btn{padding:14px 8px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);text-align:center;cursor:pointer;transition:all .15s;user-select:none}
.type-btn .ti{font-size:26px;margin-bottom:5px}
.type-btn .type-label{font-size:13px;font-weight:500}
.type-btn.active{border-color:var(--accent);background:rgba(108,99,255,.12);color:var(--text)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;padding:11px 13px;outline:none;transition:border .15s;font-family:inherit}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.6}
.field textarea{resize:none;line-height:1.5}
.photo-area{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:20px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.photo-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.photo-placeholder{color:var(--muted);font-size:13px;pointer-events:none}
.photo-placeholder .ph-icon{font-size:32px;margin-bottom:6px}
.photo-preview{display:none;flex-wrap:wrap;gap:8px;margin-top:12px}
.photo-preview img{width:72px;height:72px;object-fit:cover;border-radius:6px;border:1px solid var(--border)}
.loc-btn{width:100%;padding:13px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.loc-btn.got{border-color:var(--green);color:var(--green)}
.divider{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.addr-row{display:flex;gap:8px}
.addr-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;padding:11px 13px;outline:none;font-family:inherit}
.addr-input:focus{border-color:var(--accent)}
.addr-btn{padding:11px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap}
.map-link{display:none;margin-top:8px}
.map-link a{font-size:12px;color:var(--accent);text-decoration:none;word-break:break-all}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.submit-btn{width:100%;padding:16px;border-radius:var(--radius);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:4px}
.submit-btn.primary{background:var(--accent);color:#fff}
.submit-btn.primary:active{background:#5a52e0;transform:scale(.98)}
.submit-btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);margin-top:8px}

/* STATUS BADGES */
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.status-btn{padding:10px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);text-align:center;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;user-select:none}
.status-btn.active-s0{border-color:#6c63ff;background:rgba(108,99,255,.15);color:#6c63ff}
.status-btn.active-s1{border-color:#f59e0b;background:rgba(245,158,11,.15);color:#f59e0b}
.status-btn.active-s2{border-color:#22c55e;background:rgba(34,197,94,.15);color:#22c55e}
.status-btn.active-s3{border-color:#ff6584;background:rgba(255,101,132,.15);color:#ff6584}
.status-btn.active-s4{border-color:#8888aa;background:rgba(136,136,170,.15);color:#8888aa}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600}
.badge-0{background:rgba(108,99,255,.15);color:#6c63ff}
.badge-1{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-2{background:rgba(34,197,94,.15);color:#22c55e}
.badge-3{background:rgba(255,101,132,.15);color:#ff6584}
.badge-4{background:rgba(136,136,170,.15);color:#8888aa}

/* LIST */
.list-empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2}
.list-empty .empty-icon{font-size:40px;margin-bottom:8px}
.prop-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;cursor:pointer;transition:border .15s;active:border-color:var(--accent)}
.prop-card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;gap:8px}
.prop-name{font-size:15px;font-weight:600;color:var(--text);flex:1}
.prop-meta{font-size:12px;color:var(--muted);line-height:1.9}
.prop-meta a{color:var(--accent);text-decoration:none}

/* MODAL (detail + edit) */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.modal-sheet{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;padding:20px;padding-bottom:32px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:17px;font-weight:700}
.modal-close{font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.modal-tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.modal-tab{padding:10px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .15s;background:var(--surface2)}
.modal-tab.active{background:var(--accent);color:#fff}
.modal-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;gap:12px}
.modal-row:last-child{border-bottom:none}
.modal-label{color:var(--muted);white-space:nowrap}
.modal-value{color:var(--text);text-align:right;word-break:break-all}
.modal-value a{color:var(--accent);text-decoration:none}
.edit-section{display:none}
.edit-section.active{display:block}
.view-section{display:block}
.view-section.hidden{display:none}
.del-btn{width:100%;padding:13px;border-radius:var(--radius-sm);border:1px solid var(--accent2);background:transparent;color:var(--accent2);font-size:14px;font-weight:500;cursor:pointer;margin-top:8px}

#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--border);border-radius:100px;padding:10px 20px;font-size:13px;white-space:nowrap;opacity:0;transition:all .3s;pointer-events:none;z-index:500;max-width:300px;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.success{border-color:var(--green);color:var(--green)}
#toast.error{border-color:var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo" id="logo">物件<span>スカウト</span></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div style="font-size:12px;color:var(--muted)" id="count-label">0件</div>
      <button onclick="toggleLang()" id="lang-btn" style="padding:5px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;cursor:pointer;font-weight:600">🇹🇭 TH</button>
    </div>
  </header>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)" id="tab0"><div class="tab-icon">📍</div>現地入力</div>
    <div class="tab" onclick="switchTab(1)" id="tab1"><div class="tab-icon">📋</div>物件詳細</div>
    <div class="tab" onclick="switchTab(2)" id="tab2"><div class="tab-icon">🏠</div>保存リスト</div>
  </div>
  <div class="pages">

    <!-- PAGE 1 現地入力 -->
    <div class="page" id="page-field">
      <div class="card">
        <div class="card-title" id="type-title">物件の種類</div>
        <div class="type-grid">
          <div class="type-btn active" id="type-tenant" onclick="setType('テナント')"><div class="ti">🏪</div><div class="type-label">テナント</div></div>
          <div class="type-btn" id="type-residence" onclick="setType('住居')"><div class="ti">🏠</div><div class="type-label">住居</div></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" id="photo-title">写真</div>
        <div class="photo-area">
          <input type="file" accept="image/*" multiple onchange="handlePhotos(this,'photo-preview-new')">
          <div class="photo-placeholder"><div class="ph-icon">📷</div>タップして撮影 または ライブラリから選択</div>
        </div>
        <div class="photo-preview" id="photo-preview-new"></div>
      </div>
      <div class="card">
        <div class="card-title" id="phone-title">電話番号</div>
        <div class="field"><input type="tel" id="phone" placeholder="例：081-234-5678"/></div>
      </div>
      <div class="card">
        <div class="card-title" id="location-title">場所</div>
        <button class="loc-btn" id="loc-btn" onclick="getLocation()">
          <span id="loc-icon">📍</span><span id="loc-text">現在地を自動取得</span>
        </button>
        <div class="divider" id="location-or">または住所を手入力</div>
        <div class="addr-row">
          <input class="addr-input" id="address-input" placeholder="例：Sukhumvit Soi 11, Bangkok"/>
          <button class="addr-btn" onclick="generateMapFromAddress()" id="map-gen-btn">🗺 生成</button>
        </div>
        <div class="map-link" id="map-link"><a id="map-a" href="#" target="_blank">🗺 Googleマップで確認 →</a></div>
      </div>
      <button class="submit-btn primary" id="submit-next" onclick="submitField()">保存して詳細へ →</button>
      <button class="submit-btn secondary" id="submit-field-only" onclick="saveNow()">現地情報だけ保存</button>
    </div>

    <!-- PAGE 2 物件詳細 -->
    <div class="page hidden" id="page-detail">
      <div class="card">
        <div class="card-title" id="prop-name-title">物件名 / 識別メモ</div>
        <div class="field"><input type="text" id="prop-name" placeholder="例：Soi 11 角地テナント"/></div>
      </div>
      <div class="card">
        <div class="card-title" id="status-title">ステータス</div>
        <div class="status-grid">
          <div class="status-btn active-s0" id="snew" onclick="setStatus('未交渉')">🔵 未交渉</div>
          <div class="status-btn" id="sneg" onclick="setStatus('交渉中')">🟡 交渉中</div>
          <div class="status-btn" id="scon" onclick="setStatus('契約済み')">🟢 契約済み</div>
          <div class="status-btn" id="sng" onclick="setStatus('NG')">🔴 NG</div>
          <div class="status-btn" id="shold" onclick="setStatus('保留')">⚪ 保留</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" id="rent-title">家賃 / 費用</div>
        <div class="two-col">
          <div class="field"><label>月額家賃（฿）</label><input type="number" id="rent" placeholder="25000"/></div>
          <div class="field"><label id="deposit-label">敷金 / 保証金</label><input type="text" id="deposit" placeholder="2ヶ月"/></div>
        </div>
        <div class="field"><label id="size-label">広さ（㎡）</label><input type="number" id="size" placeholder="45"/></div>
      </div>
      <div class="card">
        <div class="card-title" id="cond-title">賃貸条件・メモ</div>
        <div class="field"><label>契約条件</label><input type="text" id="conditions" placeholder="最低1年、ペット不可"/></div>
        <div class="field" style="margin-bottom:0"><label id="notes-label">その他メモ</label><textarea id="notes" rows="4" placeholder="駐車場あり、改装交渉可"></textarea></div>
      </div>
      <button class="submit-btn primary" id="save-btn" onclick="saveNow()">💾 保存する</button>
      <button class="submit-btn secondary" id="back-btn" onclick="switchTab(0)">← 現地入力に戻る</button>
    </div>

    <!-- PAGE 3 保存リスト -->
    <div class="page hidden" id="page-list">
      <div id="list-container"></div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="modal" onclick="closeModalBg(event)">
  <div class="modal-sheet">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">物件詳細</div>
      <div class="modal-close" onclick="closeModal()">✕</div>
    </div>
    <div class="modal-tabs">
      <div class="modal-tab active" id="mtab0" onclick="switchModalTab(0)">📋 詳細</div>
      <div class="modal-tab" id="mtab1" onclick="switchModalTab(1)">✏️ 編集</div>
    </div>

    <!-- VIEW -->
    <div class="view-section" id="modal-view">
      <!-- ステータス変更 -->
      <div style="margin-bottom:14px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.08em">ステータス変更</div>
        <div class="status-grid" id="modal-status-grid"></div>
      </div>
      <div id="modal-body"></div>
      <!-- 写真 -->
      <div id="modal-photos" style="margin-top:12px"></div>
      <!-- メモ追記 -->
      <div style="margin-top:16px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.08em">メモを追記</div>
        <textarea id="append-note" rows="3" placeholder="追記メモを入力..." style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;padding:11px 13px;outline:none;font-family:inherit;resize:none;line-height:1.5"></textarea>
        <button onclick="appendNote()" style="width:100%;padding:12px;border-radius:var(--radius-sm);border:none;background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;margin-top:8px;border:1px solid var(--border)">📝 追記する</button>
      </div>
      <!-- 写真追加 -->
      <div style="margin-top:12px;position:relative">
        <label style="display:block;width:100%;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-align:center">
          📷 写真を追加
          <input type="file" accept="image/*" multiple onchange="appendPhotos(this)" style="position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0">
        </label>
      </div>
      <button class="del-btn" onclick="deleteEntry()">🗑 この物件を削除</button>
    </div>

    <!-- EDIT -->
    <div class="edit-section" id="modal-edit">
      <div class="card" style="margin-bottom:12px">
        <div class="field"><label>物件名</label><input type="text" id="edit-name"/></div>
        <div class="field"><label>電話番号</label><input type="tel" id="edit-phone"/></div>
        <div class="field"><label>住所 / マップURL</label><input type="text" id="edit-mapurl"/></div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="two-col">
          <div class="field"><label>月額家賃（฿）</label><input type="number" id="edit-rent"/></div>
          <div class="field"><label>敷金 / 保証金</label><input type="text" id="edit-deposit"/></div>
        </div>
        <div class="field"><label>広さ（㎡）</label><input type="number" id="edit-size"/></div>
        <div class="field"><label>契約条件</label><input type="text" id="edit-conditions"/></div>
        <div class="field" style="margin-bottom:0"><label>メモ</label><textarea id="edit-notes" rows="4" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;padding:11px 13px;outline:none;font-family:inherit;resize:none;line-height:1.5"></textarea></div>
      </div>
      <button onclick="saveEdit()" style="width:100%;padding:15px;border-radius:var(--radius);border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer">💾 上書き保存</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'property_scout_v2';
const STATUS_LIST = ['未交渉','交渉中','契約済み','NG','保留'];
const STATUS_EMOJI = ['🔵','🟡','🟢','🔴','⚪'];
const STATUS_CLASS = ['s0','s1','s2','s3','s4'];

let state = { type:'テナント', photoDataUrls:[], phone:'', lat:null, lng:null, mapUrl:'', rent:'', deposit:'', size:'', conditions:'', notes:'', propName:'', status:'未交渉' };
let currentId = null;
let newPhotoDataUrls = [];

// ---- TAB ----
function switchTab(idx) {
  [0,1,2].forEach(i => document.getElementById('tab'+i).classList.toggle('active', i===idx));
  document.getElementById('page-field').classList.toggle('hidden', idx!==0);
  document.getElementById('page-detail').classList.toggle('hidden', idx!==1);
  document.getElementById('page-list').classList.toggle('hidden', idx!==2);
  if(idx===2) renderList();
}

function setType(t) {
  state.type = t;
  document.getElementById('type-tenant').classList.toggle('active', t==='テナント');
  document.getElementById('type-residence').classList.toggle('active', t==='住居');
}

function setStatus(s) {
  state.status = s;
  STATUS_LIST.forEach((st,i) => {
    const ids = ['snew','sneg','scon','sng','shold'];
    const el = document.getElementById(ids[i]);
    if(el) { el.className = 'status-btn'; if(st===s) el.classList.add('active-'+STATUS_CLASS[i]); }
  });
}

// ---- PHOTOS ----
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if(w > h && w > MAX){ h = h*MAX/w; w = MAX; }
      else if(h > MAX){ w = w*MAX/h; h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function handlePhotos(input, previewId) {
  const files = Array.from(input.files).slice(0, 5);
  if(!files.length) return;
  const preview = document.getElementById(previewId);
  preview.innerHTML = ''; preview.style.display = 'flex';
  if(!state.photoDataUrls) state.photoDataUrls = [];
  showToast('写真を処理中...','');
  let loaded = 0;
  files.forEach(file => {
    compressImage(file, dataUrl => {
      state.photoDataUrls.push(dataUrl);
      const img = document.createElement('img');
      img.src = dataUrl;
      preview.appendChild(img);
      loaded++;
      if(loaded === files.length) showToast(files.length+'枚追加しました','success');
    });
  });
}

// ---- LOCATION ----
function getLocation() {
  const txt = document.getElementById('loc-text'), icon = document.getElementById('loc-icon');
  txt.textContent='取得中...'; icon.textContent='⏳';
  if(!navigator.geolocation){ showToast('位置情報が使えません','error'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    state.lat = pos.coords.latitude.toFixed(6);
    state.lng = pos.coords.longitude.toFixed(6);
    state.mapUrl = 'https://www.google.com/maps?q='+state.lat+','+state.lng;
    document.getElementById('loc-btn').classList.add('got');
    icon.textContent='✅'; txt.textContent='取得完了 ('+state.lat+', '+state.lng+')';
    document.getElementById('map-link').style.display='block';
    document.getElementById('map-a').href=state.mapUrl;
    showToast('現在地を取得しました','success');
  }, ()=>{ icon.textContent='❌'; txt.textContent='取得できませんでした'; showToast('取得に失敗しました','error'); }, {enableHighAccuracy:true,timeout:10000});
}

function generateMapFromAddress() {
  const addr = document.getElementById('address-input').value.trim();
  if(!addr){ showToast('住所を入力してください','error'); return; }
  state.mapUrl = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
  state.lat=null; state.lng=null;
  document.getElementById('map-link').style.display='block';
  document.getElementById('map-a').href=state.mapUrl;
  showToast('マップリンクを生成しました','success');
}

// ---- LIST ----
function getList() { try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch(e){ return []; } }
function saveList(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function updateCount(){ document.getElementById('count-label').textContent = getList().length+'件'; }

function renderList() {
  const list = getList();
  const c = document.getElementById('list-container');
  if(!list.length){
    c.innerHTML='<div class="list-empty"><div class="empty-icon">🏠</div>まだ物件が保存されていません<br>現地入力から追加してください</div>';
    return;
  }
  c.innerHTML = list.slice().reverse().map(p => {
    const si = STATUS_LIST.indexOf(p.status||'未交渉');
    return `<div class="prop-card" onclick="openModal(${p.id})">
      <div class="prop-card-header">
        <div class="prop-name">${p.propName}</div>
        <span class="badge badge-${si>=0?si:0}">${STATUS_EMOJI[si>=0?si:0]} ${p.status||'未交渉'}</span>
      </div>
      <div class="prop-meta">
        ${p.type}　${p.rent?'฿'+Number(p.rent).toLocaleString()+'/月　':''}${p.size?p.size+'㎡　':''}${p.phone?'📞'+p.phone+'　':''}${p.mapUrl?'<a href="'+p.mapUrl+'" target="_blank" onclick="event.stopPropagation()">🗺 地図</a>':''}
        <br><span style="font-size:11px;color:var(--muted)">${p.timestamp}</span>
      </div>
    </div>`;
  }).join('');
}

// ---- MODAL ----
function openModal(id) {
  currentId = id;
  const p = getList().find(x=>x.id===id);
  if(!p) return;
  document.getElementById('modal-title').textContent = p.propName;
  // status grid
  document.getElementById('modal-status-grid').innerHTML = STATUS_LIST.map((s,i)=>{
    const active = (p.status||'未交渉')===s ? 'active-'+STATUS_CLASS[i] : '';
    return `<div class="status-btn ${active}" onclick="changeStatus('${s}')">${STATUS_EMOJI[i]} ${s}</div>`;
  }).join('');
  // detail rows
  const rows = [
    ['種類',p.type],['日時',p.timestamp],['電話',p.phone||'未入力'],
    ['場所',p.mapUrl?'<a href="'+p.mapUrl+'" target="_blank">🗺 地図を開く</a>':'未入力'],
    ['家賃',p.rent?'฿'+Number(p.rent).toLocaleString()+'/月':'未入力'],
    ['敷金',p.deposit||'未入力'],['広さ',p.size?p.size+'㎡':'未入力'],
    ['条件',p.conditions||'未入力'],['メモ',p.notes||'未入力'],
  ];
  if(p.appendedNotes && p.appendedNotes.length){
    p.appendedNotes.forEach((n,i)=>rows.push(['追記'+(i+1),n.text+' ('+n.time+')']));
  }
  document.getElementById('modal-body').innerHTML = rows.map(([l,v])=>
    '<div class="modal-row"><span class="modal-label">'+l+'</span><span class="modal-value">'+v+'</span></div>'
  ).join('');
  // photos
  const mp = document.getElementById('modal-photos');
  if(p.photoDataUrls && p.photoDataUrls.length){
    mp.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:8px">'+p.photoDataUrls.map(src=>'<img src="'+src+'" style="width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">').join('')+'</div>';
  } else { mp.innerHTML=''; }
  // edit fields
  document.getElementById('edit-name').value = p.propName||'';
  document.getElementById('edit-phone').value = p.phone||'';
  document.getElementById('edit-mapurl').value = p.mapUrl||'';
  document.getElementById('edit-rent').value = p.rent||'';
  document.getElementById('edit-deposit').value = p.deposit||'';
  document.getElementById('edit-size').value = p.size||'';
  document.getElementById('edit-conditions').value = p.conditions||'';
  document.getElementById('edit-notes').value = p.notes||'';
  document.getElementById('append-note').value = '';
  switchModalTab(0);
  document.getElementById('modal').classList.add('open');
}

function switchModalTab(idx){
  document.getElementById('mtab0').classList.toggle('active', idx===0);
  document.getElementById('mtab1').classList.toggle('active', idx===1);
  document.getElementById('modal-view').classList.toggle('hidden', idx!==0);
  document.getElementById('modal-edit').style.display = idx===1?'block':'none';
  document.getElementById('modal-view').style.display = idx===0?'block':'none';
}

function changeStatus(s){
  const list = getList();
  const p = list.find(x=>x.id===currentId);
  if(!p) return;
  p.status = s;
  saveList(list);
  updateCount();
  renderList();
  // update badges in modal
  document.getElementById('modal-status-grid').innerHTML = STATUS_LIST.map((st,i)=>{
    const active = st===s?'active-'+STATUS_CLASS[i]:'';
    return `<div class="status-btn ${active}" onclick="changeStatus('${st}')">${STATUS_EMOJI[i]} ${st}</div>`;
  }).join('');
  showToast('ステータスを「'+s+'」に変更しました','success');
}

function appendNote(){
  const txt = document.getElementById('append-note').value.trim();
  if(!txt){ showToast('メモを入力してください','error'); return; }
  const list = getList();
  const p = list.find(x=>x.id===currentId);
  if(!p) return;
  if(!p.appendedNotes) p.appendedNotes=[];
  p.appendedNotes.push({text:txt, time:new Date().toLocaleString('ja-JP',{timeZone:'Asia/Bangkok'})});
  saveList(list);
  document.getElementById('append-note').value='';
  showToast('追記しました','success');
  openModal(currentId);
}

function appendPhotos(input){
  const files = Array.from(input.files).slice(0, 5);
  if(!files.length) return;
  const list = getList();
  const p = list.find(x=>x.id===currentId);
  if(!p) return;
  if(!p.photoDataUrls) p.photoDataUrls = [];
  showToast('写真を処理中...','');
  let loaded = 0;
  files.forEach(file => {
    compressImage(file, dataUrl => {
      p.photoDataUrls.push(dataUrl);
      loaded++;
      if(loaded === files.length){
        saveList(list);
        showToast(files.length+'枚追加しました','success');
        openModal(currentId);
      }
    });
  });
}

function saveEdit(){
  const list = getList();
  const p = list.find(x=>x.id===currentId);
  if(!p) return;
  p.propName = document.getElementById('edit-name').value||p.propName;
  p.phone = document.getElementById('edit-phone').value;
  p.mapUrl = document.getElementById('edit-mapurl').value;
  p.rent = document.getElementById('edit-rent').value;
  p.deposit = document.getElementById('edit-deposit').value;
  p.size = document.getElementById('edit-size').value;
  p.conditions = document.getElementById('edit-conditions').value;
  p.notes = document.getElementById('edit-notes').value;
  saveList(list);
  renderList();
  showToast('上書き保存しました','success');
  openModal(currentId);
  switchModalTab(0);
}

function deleteEntry(){
  if(!confirm('この物件を削除しますか？')) return;
  const list = getList().filter(x=>x.id!==currentId);
  saveList(list);
  updateCount();
  renderList();
  closeModal();
  showToast('削除しました','success');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); currentId=null; }
function closeModalBg(e){ if(e.target===document.getElementById('modal')) closeModal(); }

function resetForm(){
  state={type:state.type,photoDataUrls:[],phone:'',lat:null,lng:null,mapUrl:'',rent:'',deposit:'',size:'',conditions:'',notes:'',propName:'',status:'未交渉'};
  ['phone','rent','deposit','size','conditions','notes','prop-name','address-input'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
  document.getElementById('photo-preview-new').style.display='none';
  document.getElementById('photo-preview-new').innerHTML='';
  document.getElementById('loc-btn').classList.remove('got');
  document.getElementById('loc-icon').textContent='📍';
  document.getElementById('loc-text').textContent='現在地を自動取得';
  document.getElementById('map-link').style.display='none';
  setStatus('未交渉');
}

function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  setTimeout(()=>{ t.className=''; },2800);
}

updateCount();
